<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuFA Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='indicators.css') }}">

</head>
<body>
    
  <!-- Верхняя панель -->
  <div class="top-panel">
    <div>Logo</div>
    <div>Home</div>
    <div>User</div>
  </div>

  <!-- Панель навигации слева -->
  <div class="sidebar">
    <a href="home">
      <span>Home</span>
    </a>
    <a href="system">
      <span>System</span>
    </a>
    <a href="controllers">
      <span>Controllers</span>
    </a>
  </div>


  <div class="content">


  <!-- Server block -->
      <div class="info-block", style="width: 40%; height: 40%;">
        <canvas id="NetworkUsage" width="400" height="200"></canvas>

        
        <h2>Server</h2>

        <div class="server-status">
          <span class="status-indicator"></span>
          <span class="status-text">Сервер Онлайн</span>
        </div>


        <div style="display: flex; justify-content: space-between; align-items: center;">
        <p id="flaskhost">Flask host: ip:port</p>
        <p id="mcishost">MCIS host: ip:port</p>
        </div>

        <p id="uptime">Uptime</p>

        <div style="display: flex; justify-content: space-between; align-items: center;">
        <p id="download">Download</p>
        <p id="upload">Upload</p>
        </div>

      </div>



      <div class="info-block", style="width: 40%; height: 50%;">

            <canvas id="CpuUsage" style="width: 400; height: 400;"></canvas>

            <h2>Hardware</h2>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <p id="cpu">CPU</p>
              <p id="ram">RAM</p>
             </div>
          
      </div>


  </div>

  <script src="{{ url_for('static', filename='chart.js') }}"></script>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
  <script src="{{ url_for('static', filename='cpu_usage.js') }}"></script>
  <script src="{{ url_for('static', filename='network_usage.js') }}"></script>

</body>
</html>
