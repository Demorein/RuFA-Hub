<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Галерея</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>🌟 Живая фотогалерея</h1>
  <div class="gallery" id="gallery"></div>

  <script>
    async function loadImages() {
      const response = await fetch('/images');
      const images = await response.json();
      const gallery = document.getElementById('gallery');
      const currentImages = Array.from(gallery.getElementsByTagName('img')).map(img => img.src);

      // Добавляем только новые изображения
      images.forEach(src => {
        if (!currentImages.includes(location.origin + src)) {
          const img = document.createElement('img');
          img.src = src;
          gallery.appendChild(img);
        }
      });
    }

    // Загружаем изображения при загрузке страницы
    loadImages();

    // Обновляем каждые 2 секунды
    setInterval(loadImages, 2000);
  </script>
</body>
</html>
